<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pré-visite usine</title>
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pré-visite">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="image-application/icone-installation-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#F3F3F4; --surface:#FFFFFF; --surface-2:#F7F7F8; --ink:#1F1F22; --muted:#6B6B71; --line:#E2E2E5;
  --accent:#2A2A2E; --accent-ink:#FFFFFF; --brand:#E1271B;
  --yes:#1E8E4E; --yes-tint:#E2F3E8; --maybe:#E0A800; --maybe-ink:#2A2100; --maybe-tint:#FCF2D2; --no:#C8372D; --no-tint:#FAE3E1;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121214; --surface:#1B1B1E; --surface-2:#232327; --ink:#ECECEE; --muted:#A1A1A7; --line:#323237;
    --accent:#ECECEE; --accent-ink:#121214;
    --yes-tint:#15352A; --maybe-tint:#3A3113; --no-tint:#3D1D1B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121214; --surface:#1B1B1E; --surface-2:#232327; --ink:#ECECEE; --muted:#A1A1A7; --line:#323237;
  --accent:#ECECEE; --accent-ink:#121214;
  --yes-tint:#15352A; --maybe-tint:#3A3113; --no-tint:#3D1D1B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit}
button,select,input,textarea,label{touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:3px solid var(--brand)}
.logo{width:46px;height:46px;border-radius:8px;flex:0 0 auto;display:block}
.top-in{max-width:1400px;margin:0 auto;padding:12px 16px 8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{flex:1 1 200px;min-width:0}
.brand h1{margin:0;font:600 1.3rem/1.15 "Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.langs button{min-width:46px;height:40px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink);font-weight:600;cursor:pointer}
.langs button:last-child{border-right:0}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.gauge-wrap{max-width:1400px;margin:0 auto;padding:0 16px 10px}
.gauge{display:flex;height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.gauge span{display:block;height:100%;width:0;transition:width .25s ease}
.g-y{background:var(--yes)} .g-m{background:var(--maybe)} .g-n{background:var(--no)}
.gauge-txt{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin-top:5px}
.legend{display:flex;gap:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Contenu */
main{max-width:1400px;margin:0 auto;padding:16px 16px 130px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:18px;overflow:hidden}
.card h2{margin:0;padding:14px 16px;font:600 1.1rem/1.2 "Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;border-bottom:1px solid var(--line)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.card-head h2{padding:4px 0;border-bottom:0}
.hdate{display:flex;align-items:center;gap:10px}
.hdate span{font-size:.86rem;font-weight:600;color:var(--muted);white-space:nowrap}
.hdate input{width:auto;min-height:42px;padding:8px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;padding:16px}
.grid label span{display:block;font-size:.86rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.grid .wide{grid-column:1/-1}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
select{min-height:46px}
.grid .team>span{display:block;font-size:.86rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.team-row{display:grid;grid-template-columns:minmax(140px,200px) 1fr 46px;gap:8px;margin-bottom:8px}
.team-x{font-size:20px;line-height:1}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}

.ch-head{display:flex;align-items:baseline;gap:12px;width:100%;padding:14px 16px;background:none;border:0;color:inherit;text-align:left;cursor:pointer}
.ch-num{font:600 1.5rem/1 "Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--brand);min-width:1.6ch}
.ch-title{flex:1;font:600 1.05rem/1.25 "Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif}
.ch-count{font-size:.86rem;color:var(--muted);white-space:nowrap}
.ch-arrow{width:18px;height:18px;align-self:center;transition:transform .2s;color:var(--muted)}
.ch-head[aria-expanded="false"] .ch-arrow{transform:rotate(-90deg)}
.ch-body{border-top:1px solid var(--line)}

.q{padding:12px 16px 12px 13px;border-bottom:1px solid var(--line);border-left:5px solid transparent;transition:background-color .15s}
.q.flash{box-shadow:inset 0 0 0 3px var(--accent)}
.q[data-s="y"]{border-left-color:var(--yes);background:var(--yes-tint)}
.q[data-s="m"]{border-left-color:var(--maybe);background:var(--maybe-tint)}
.q[data-s="n"]{border-left-color:var(--no);background:var(--no-tint)}
.q-text{margin:0 0 10px;font-weight:500;max-width:72ch;overflow-wrap:anywhere}
.q-tag{display:flex;align-items:center;gap:10px;margin:-4px 0 8px;font-size:.8rem;color:var(--muted)}
.linkb{border:0;background:none;color:var(--no);text-decoration:underline;cursor:pointer;padding:4px 0;font-size:.85rem}
.q-ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;flex:1 1 270px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg-b{flex:1;min-height:46px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink);font-weight:600;font-size:.98rem;cursor:pointer;padding:0 6px}
.seg-b:last-child{border-right:0}
.s-y[aria-pressed="true"]{background:var(--yes);color:#fff}
.s-m[aria-pressed="true"]{background:var(--maybe);color:var(--maybe-ink)}
.s-n[aria-pressed="true"]{background:var(--no);color:#fff}
.icon-b{position:relative;width:46px;height:46px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.icon-b[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.icon-b .dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.icon-b .cnt{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:600;display:grid;place-items:center;padding:0 5px}
.cbox{margin-top:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.th{margin:0;position:relative;width:88px;height:88px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th-x{position:absolute;top:3px;right:3px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:19px;line-height:1;cursor:pointer}

.addq{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.addq p{margin:0 0 6px;font-size:.86rem;font-weight:600;color:var(--muted)}
.row{display:flex;gap:8px}
.row input{flex:1}
.chn{padding:14px 16px 16px}
.chn h3{margin:0 0 8px;font:600 .9rem/1.3 "Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--muted)}
.btn{min-height:46px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-ph{margin-top:10px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--no);border-color:var(--no);color:#fff}
.btn:disabled{opacity:.6;cursor:progress}
.pad{padding:16px}
.note{font-size:.84rem;color:var(--muted);margin:10px 0 0}

/* Barre d'action */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px calc(16px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
.bar-in{max-width:1400px;margin:0 auto;display:flex;gap:10px}
.bar .primary{flex:1;font-size:1.05rem}

/* Fenêtre modale */
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,14,18,.55);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:440px;background:var(--surface);color:var(--ink);border-radius:12px;border:1px solid var(--line);padding:20px}
.sheet h2{margin:0 0 14px;font:600 1.15rem/1.25 "Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lgrid button{min-height:52px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer}
.lgrid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.m-note{font-size:.9rem;color:var(--muted);margin:14px 0 0}
.m-err{font-size:.9rem;color:var(--no);margin:10px 0 0}
.m-act{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-weight:500;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.lang-sel{display:none;width:auto;min-height:40px;padding:6px 8px;font-weight:600}
.btn-ico{display:none}
@media (max-width:520px){
  .top-in{flex-wrap:nowrap;padding:8px 12px 6px;gap:10px}
  .brand h1{font-size:1.05rem}
  .brand p{font-size:.82rem}
  .logo{width:40px;height:40px}
  .langs{display:none}
  .lang-sel{display:block}
  .gauge-wrap{padding:0 12px 8px}
  .gauge{height:8px}
  .gauge-txt{flex-wrap:nowrap;margin-top:4px}
  .g-lbl{display:none}
  .legend{gap:10px}
  main{padding:10px 8px 120px}
  .q{padding:12px 10px 12px 9px}
  .q-ctrl{flex-wrap:nowrap;gap:6px}
  .seg{flex:1 1 0;min-width:0}
  .seg-b{font-size:.9rem;padding:0 2px}
  .icon-b{width:44px}
  .bar{padding-left:12px;padding-right:12px}
  #bNew{padding:0;width:48px;flex:0 0 auto}
  #bNew .btn-txt{display:none}
  #bNew .btn-ico{display:block}
  .team-row{grid-template-columns:1fr 46px}
  .team-row select{grid-column:1/-1}
}
@media (max-width:380px){.seg-b{font-size:.82rem;white-space:nowrap}}
@media (max-height:500px) and (orientation:landscape){
  .top{position:static}
  .bar{padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:1024px){
  main{padding-left:24px;padding-right:24px}
  .top-in,.gauge-wrap{padding-left:24px;padding-right:24px}
  .q{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:24px;align-items:center;padding-left:19px;padding-right:24px}
  .q-text{grid-row:1;grid-column:1;margin:0;max-width:none}
  .q-ctrl{grid-row:1;grid-column:2;flex-wrap:nowrap}
  .q-ctrl .seg{flex:0 0 340px}
  .q-tag,.cbox,.thumbs{grid-column:1/-1}
  .q-tag{margin:6px 0 0}
  .bar-in{justify-content:flex-end;padding:0 8px}
  .bar .primary{flex:0 1 380px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <img class="logo" id="logo" src="image-document/logo-ac.png" alt="Auxiliar Conservera">
    <div class="brand"><h1 id="hTitle">Pré-visite usine</h1><p id="hSub"></p></div>
    <div class="langs" id="langs" role="group" aria-label="Langue"></div>
    <select class="lang-sel" id="langSel" aria-label="Langue"></select>
  </div>
  <div class="gauge-wrap">
    <div class="gauge" aria-hidden="true"><span class="g-y" id="gY"></span><span class="g-m" id="gM"></span><span class="g-n" id="gN"></span></div>
    <div class="gauge-txt"><span id="gTxt"></span><span class="legend" id="gLeg"></span></div>
  </div>
</header>

<main id="main"></main>

<div class="bar"><div class="bar-in">
  <button class="btn" type="button" id="bNew"><svg class="btn-ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg><span class="btn-txt"></span></button>
  <button class="btn primary" type="button" id="bPdf"></button>
</div></div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div class="m-act" id="mAct"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ===================== Stockage local (IndexedDB) ===================== */
let dbp = null;
function idb(){
  if (dbp) return dbp;
  dbp = new Promise(res => {
    try {
      const r = indexedDB.open("previsite-usine", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
      r.onblocked = () => res(null);
    } catch (e) { res(null); }
  });
  return dbp;
}
async function kvOp(mode, fn){
  try {
    const db = await idb(); if (!db) return null;
    return await new Promise(res => {
      const tx = db.transaction("kv", mode); let out = null;
      const rq = fn(tx.objectStore("kv"));
      if (rq) rq.onsuccess = () => { out = rq.result; };
      tx.oncomplete = () => res(out); tx.onerror = () => res(null); tx.onabort = () => res(null);
    });
  } catch (e) { return null; }
}
const kvSet = (k,v) => kvOp("readwrite", s => s.put(v,k));
const kvDel = k => kvOp("readwrite", s => s.delete(k));
const kvClear = () => kvOp("readwrite", s => s.clear());
async function kvAll(){
  try {
    const db = await idb(); if (!db) return {};
    return await new Promise(res => {
      const out = {}; const tx = db.transaction("kv","readonly"); const rq = tx.objectStore("kv").openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
      rq.onerror = () => res(out);
    });
  } catch (e) { return {}; }
}
let saveTimer;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => kvSet("state", JSON.stringify(S)), 400); }

/* ===================== Photos ===================== */
const fileIn = document.createElement("input");
fileIn.type = "file"; fileIn.accept = "image/*"; fileIn.multiple = true; fileIn.hidden = true;
document.body.append(fileIn);
let onFiles = null;
fileIn.addEventListener("change", async () => {
  const files = [...fileIn.files]; fileIn.value = "";
  const cb = onFiles; onFiles = null; if (!cb) return;
  for (const f of files) {
    try {
      const ph = await compress(f);
      const id = uid("ph"); PH[id] = ph; kvSet("p:"+id, ph); cb(id);
    } catch (e) { toast(t("photoErr")); }
  }
});
function pickPhotos(cb){ onFiles = cb; fileIn.click(); }
function compress(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const max = 1600; let w = img.naturalWidth, h = img.naturalHeight;
      if (!w || !h) { URL.revokeObjectURL(url); rej(); return; }
      const r = Math.min(1, max / Math.max(w,h)); w = Math.round(w*r); h = Math.round(h*r);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res({d: c.toDataURL("image/jpeg", 0.82), w, h});
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
function removePhoto(arr, id){ const i = arr.indexOf(id); if (i > -1) arr.splice(i,1); delete PH[id]; kvDel("p:"+id); save(); }
function strip(arr, onChange){
  const w = el("div","thumbs");
  w.redraw = () => {
    w.innerHTML = "";
    arr.forEach(id => {
      const ph = PH[id]; if (!ph) return;
      const f = el("figure","th"); const im = new Image(); im.src = ph.d; im.alt = "";
      const x = el("button","th-x","×"); x.type = "button"; x.setAttribute("aria-label", t("remove"));
      x.onclick = () => { removePhoto(arr,id); w.redraw(); if (onChange) onChange(); };
      f.append(im, x); w.append(f);
    });
    w.hidden = !arr.some(id => PH[id]);
  };
  w.redraw(); return w;
}

const $ = s => document.querySelector(s);
function el(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

function allIds(){ const out=[]; CH.forEach(ch => { ch.q.forEach(q => out.push(q[0])); (S.custom[ch.id]||[]).forEach(c => out.push(c.id)); }); return out; }
function counts(){ let y=0,m=0,n=0; const ids=allIds(); ids.forEach(id => { const s=S.ans[id]&&S.ans[id].s; if(s==="y")y++; else if(s==="m")m++; else if(s==="n")n++; }); return {y,m,n,tot:ids.length,na:ids.length-y-m-n}; }

function updateProgress(){
  const c = counts(); const tot = c.tot || 1;
  $("#gY").style.width = (c.y/tot*100)+"%"; $("#gM").style.width = (c.m/tot*100)+"%"; $("#gN").style.width = (c.n/tot*100)+"%";
  const gt = $("#gTxt"); gt.innerHTML = "";
  gt.append(el("b",null,`${c.y+c.m+c.n} / ${c.tot}`), el("span","g-lbl"," "+t("answered")));
  const leg = $("#gLeg"); leg.innerHTML = "";
  [["y","yes","var(--yes)"],["m","maybe","var(--maybe)"],["n","no","var(--no)"]].forEach(([k,lab,colr]) => {
    const s = el("span"); const i = el("i"); i.style.background = colr; s.append(i, document.createTextNode(`${t(lab)} ${c[k]}`)); leg.append(s);
  });
  CH.forEach(ch => updateChCount(ch.id));
}
function updateChCount(cid){
  const ch = CH.find(c => c.id === cid); if (!ch) return;
  const ids = ch.q.map(q => q[0]).concat((S.custom[cid]||[]).map(c => c.id));

/* ===================== Modale, toast ===================== */
let toastT;
function toast(msg){ const e = $("#toast"); e.textContent = msg; e.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove("show"), 3200); }
let modalBusy = false;
function openModal(title, bodyNodes, actions){
  $("#mTitle").textContent = title;
  const b = $("#mBody"); b.innerHTML = ""; bodyNodes.forEach(n => b.append(n));
  const a = $("#mAct"); a.innerHTML = ""; actions.forEach(n => a.append(n));
  $("#modal").hidden = false;
  const first = a.querySelector(".primary,.danger"); if (first) first.focus();
}
function closeModal(){ if (modalBusy) return; $("#modal").hidden = true; }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modal").hidden) closeModal(); });

function openReset(){

  const ok = el("button","btn danger",t("resetOk")); ok.type = "button";

  };
  openModal(t("newForm"), [el("p",null,t("resetQ"))], [cancel, ok]);
}

let dlP = null;
function getDownloads(){
  try { if (!dlP && window.claude && typeof window.claude.use === "function") dlP = window.claude.use("downloads"); } catch (e) {}
  return dlP ? dlP.catch(() => null) : Promise.resolve(null);
}

// Étape 1 de la validation : accord sur les questions sans réponse

// Amène l’utilisateur à la première question sans réponse
function goToFirstUnanswered(){
  for (const ch of CH) {
    const ids = ch.q.map(q => q[0]).concat((S.custom[ch.id]||[]).map(x => x.id));
    const id = ids.find(i => !(S.ans[i] && S.ans[i].s));
    if (!id) continue;
    const row = document.querySelector(`.q[data-qid="${id}"]`); if (!row) return;
    const body = row.closest(".ch-body");

    row.scrollIntoView({block:"center", behavior: smooth ? "smooth" : "auto"});
    row.classList.add("flash"); setTimeout(() => row.classList.remove("flash"), 1800);

function openLangModal(){
  let pick = L();
  const lg = el("div","lgrid"); const lb = [];
  LANGS.forEach((x,i) => {
    const b = el("button",null,LNAME[i]); b.type = "button"; b.setAttribute("aria-pressed", String(i===pick));
    b.onclick = () => { pick = i; lb.forEach((bb,j) => bb.setAttribute("aria-pressed", String(j===pick))); };
    lb.push(b); lg.append(b);
  });
  const c = counts();
  const note = el("p","m-note", c.na ? `${c.na} ${t("unanswered")}` : t("allDone"));
  const note2 = el("p","m-note", t("userText"));
  const err = el("p","m-err"); err.hidden = true;
  const cancel = el("button","btn",t("cancel")); cancel.type = "button"; cancel.onclick = closeModal;
  const go = el("button","btn primary",t("create")); go.type = "button";
  go.onclick = () => {
    err.hidden = true; modalBusy = true; go.disabled = true; cancel.disabled = true; go.textContent = t("creating");
    setTimeout(async () => {
      let done = false;
      try {
        if (!window.jspdf || !window.jspdf.jsPDF) throw new Error(t("noLib"));
        const doc = buildPdf(pick);
        const res = await deliver(doc, fileName(pick));
        if (res && res.share) { modalBusy = false; offerShare(res.file, doc); return; }
        done = res;
      } catch (e) {
        err.textContent = t("error") + (e && e.message ? e.message : String(e)); err.hidden = false;
      }
      modalBusy = false; go.disabled = false; cancel.disabled = false; go.textContent = t("create");
      if (done) closeModal();
    }, 30);
  };
  openModal(t("pdfLang"), [lg, note, note2, err], [cancel, go]);
}

async function deliver(doc, name){
  const dl = await getDownloads();
  if (dl) {
    const blob = doc.output("blob");
    try { await dl.save({filename: name, data: blob}); toast(t("saved")); return true; }
    catch (e) {
      const code = e && e.code;
      if (code === "declined") { toast(t("declined")); return false; }
      if (code === "rate_limited") { toast(t("busy")); return false; }
      if (code !== "unavailable" && code !== "not_granted" && code !== "capability_disabled" && code !== "capability_removed") {
        throw new Error(code || (e && e.message) || "save");
      }
    }
  }
  // Hors claude.ai : sur téléphone/tablette, menu de partage (Fichiers, e-mail, WhatsApp…)
  try {
    const file = new File([doc.output("blob")], name, {type:"application/pdf"});
    if (matchMedia("(pointer: coarse)").matches && navigator.canShare && navigator.canShare({files:[file]})) return {share:true, file};
  } catch (e) {}
  doc.save(name);
  return true;
}

// Le partage exige un appui direct de l’utilisateur : on le propose dans un second temps
function offerShare(file, doc){
  const st = el("button","btn primary",t("share")); st.type = "button";
  const dl = el("button","btn",t("download")); dl.type = "button";
  st.onclick = async () => {
    try { await navigator.share({files:[file], title:file.name}); toast(t("saved")); closeModal(); }
    catch (e) { if (e && e.name === "AbortError") return; doc.save(file.name); closeModal(); }
  };
  dl.onclick = () => { doc.save(file.name); closeModal(); };
  openModal(t("ready"), [el("p","m-note",file.name)], [dl, st]);
}

/* ===================== PDF A4 ===================== */
function clean(s){
  return String(s == null ? "" : s)
    .replace(/[\u2018\u2019\u02BC]/g,"'").replace(/[\u201C\u201D]/g,'"')
    .replace(/[\u2013\u2014]/g,"-").replace(/\u2026/g,"...")
    .replace(/\u0153/g,"oe").replace(/\u0152/g,"OE").replace(/\u20AC/g,"EUR")
    .replace(/[\u00A0\u202F]/g," ").replace(/\r/g,"")
    .replace(/[^\x00-\xFF]/g,"?");
}
function slug(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40); }
function fmtDate(v, loc){ const d = new Date(v+"T00:00:00"); return isNaN(d) ? v : d.toLocaleDateString(loc); }
function fileName(li){
  const d = S.info.date || new Date().toISOString().slice(0,10);
  return `PreVisite_${slug(S.info.client) || "client"}_${d}_${LANGS[li].toUpperCase()}.pdf`;
}

function buildPdf(li){
  const doc = new window.jspdf.jsPDF({unit:"mm", format:"a4", orientation:"portrait", compress:true});
  const W = 210, H = 297, M = 15, CW = W - 2*M, BOT = H - 18;
  const tr = k => T[k][li]; const loc = LOC[li];
  const C = {brand:[225,39,27], ink:[31,31,34], mut:[107,107,113], line:[222,222,226], tint:[244,244,245], y:[30,142,78], m:[224,168,0], n:[200,55,45], na:[160,168,175], white:[255,255,255]};
  let y = M;
  const font = (st, sz) => { doc.setFont("helvetica", st); doc.setFontSize(sz); };
  const tc = c => doc.setTextColor(c[0],c[1],c[2]);
  const fc = c => doc.setFillColor(c[0],c[1],c[2]);
  const dc = c => doc.setDrawColor(c[0],c[1],c[2]);
  const ensure = h => { if (y + h > BOT) { doc.addPage(); y = M; } };
  const para = (txt, x, w, sz, st, c, lh) => {
    font(st, sz); tc(c);
    doc.splitTextToSize(clean(txt), w).forEach(l => { ensure(lh); doc.text(l, x, y + lh*0.75); y += lh; });
  };
  const h2 = (txt, right) => { ensure(16); font("bold",12); tc(C.ink); doc.text(clean(txt), M, y+5);
    if (right) { font("normal",10); tc(C.ink); doc.text(clean(right), W-M, y+5, {align:"right"}); } y += 7.5; fc(C.brand); doc.rect(M, y-0.2, 18, 0.7, "F"); dc(C.line); doc.setLineWidth(0.2); doc.line(M+18, y+0.15, W-M, y+0.15); y += 4; };
  const photos = ids => {
    const list = ids.filter(id => PH[id]).map(id => ({id, p:PH[id]}));
    if (!list.length) return;
    const per = 3, gap = 4, cw = (CW - gap*(per-1)) / per, mh = 48;
    y += 1.5;
    for (let i = 0; i < list.length; i += per) {
      const row = list.slice(i, i+per).map(o => { const r = Math.min(cw/o.p.w, mh/o.p.h); return {o, w:o.p.w*r, h:o.p.h*r}; });
      const rh = Math.max(...row.map(r => r.h));
      ensure(rh + 2);
      row.forEach((r,k) => { try { doc.addImage(r.o.p.d, "JPEG", M + k*(cw+gap), y, r.w, r.h, r.o.id, "FAST"); } catch (e) {} });
      y += rh + gap;
    }
  };

  // En-tête
  if (LOGO) { try { doc.addImage(LOGO, "PNG", M, 10, 17, 17, "logo", "FAST"); } catch (e) {} }
  font("bold",16); tc(C.ink); doc.text(clean(tr("report")), M+22, 17);
  font("normal",10.5); tc(C.mut); doc.text(clean((S.info.client||"").trim() || "-"), M+22, 23.5);
  font("normal",8.5); doc.text(clean(tr("generated")+" "+new Date().toLocaleDateString(loc)), W-M, 23.5, {align:"right"});
  fc(C.brand); doc.rect(M, 31, CW, 0.8, "F");
  y = 38;

  // Informations générales
  const df = FIELDS.find(f => f[1] === "date"); const dv = (S.info[df[0]]||"").trim();
  h2(tr("info"), `${df[2][li]}${li===0?" : ":": "}${dv ? fmtDate(dv, loc) : "-"}`);
  FIELDS.forEach(([id,type,labels]) => {
    if (type === "date") return;
    let v = type === "team"
      ? S.team.filter(m => (m.n||"").trim()).map(m => `${m.n.trim()} (${roleName(m.r, li)})`).join("\n")
      : (S.info[id]||"").trim();
    font("normal",10); const vl = doc.splitTextToSize(clean(v || "-"), CW - 55);
    const lab = doc.splitTextToSize(clean(labels[li]), 52);
    const h = Math.max(vl.length, lab.length) * 5 + 2;
    ensure(h);
    font("bold",9); tc(C.mut); lab.forEach((l,i) => doc.text(l, M, y+4+i*5));
    font("normal",10); tc(C.ink); vl.forEach((l,i) => doc.text(l, M+55, y+4+i*5));
    y += h; dc(C.line); doc.setLineWidth(0.2); doc.line(M, y-1, W-M, y-1);
  });
  y += 5;

  // Synthèse
  const c = counts(); const tot = c.tot || 1;
  h2(tr("summary"));
  ensure(20);
  let bx = M;
  [[c.y,C.y],[c.m,C.m],[c.n,C.n],[c.na,C.na]].forEach(([v,col]) => { if (!v) return; const w = CW*v/tot; fc(col); doc.rect(bx, y, w, 5, "F"); bx += w; });
  y += 10;
  const legend = [[tr("yes"),c.y,C.y],[tr("maybe"),c.m,C.m],[tr("no"),c.n,C.n],[tr("na"),c.na,C.na]];
  legend.forEach(([lab,v,col],i) => {
    const x = M + i*(CW/4); fc(col); doc.rect(x, y-3.2, 4, 4, "F");
    font("normal",10); tc(C.ink); doc.text(clean(`${lab} : ${v}`).replace(" : ", li===0 ? " : " : ": "), x+6, y);
  });
  y += 9;

  // Chapitres
  CH.forEach((ch,i) => {
    ensure(24);
    fc(C.tint); doc.rect(M, y, CW, 9, "F");
    font("bold",11.5); tc(C.brand); doc.text(String(i+1), M+3, y+6.3);
    tc(C.ink); doc.text(clean(ch.t[li]), M+11, y+6.3);
    y += 12;
    const qs = ch.q.map(q => ({id:q[0], x:q[li+1]})).concat((S.custom[ch.id]||[]).map(cq => ({id:cq.id, x:cq.x})));
    qs.forEach(q => {
      const a = S.ans[q.id] || {};
      font("normal",10); const lines = doc.splitTextToSize(clean(q.x), CW - 36);
      const h = Math.max(lines.length*4.8, 6.5);
      ensure(h + 3);
      tc(C.ink); lines.forEach((l,k) => doc.text(l, M, y+4+k*4.8));
      const s = a.s;
      const pc = s==="y" ? C.y : s==="m" ? C.m : s==="n" ? C.n : C.na;
      const pl = s==="y" ? tr("yes") : s==="m" ? tr("maybe") : s==="n" ? tr("no") : tr("na");
      fc(pc); doc.roundedRect(W-M-30, y, 30, 6.5, 1.5, 1.5, "F");
      font("bold",8.5); tc(s==="m" ? [42,33,0] : C.white); doc.text(clean(pl), W-M-15, y+4.4, {align:"center"});
      y += h + 1.5;
      if ((a.c||"").trim()) para(`${tr("comment")}${li===0?" : ":": "}${a.c.trim()}`, M+4, CW-40, 9, "italic", C.mut, 4.3);
      if (a.p && a.p.length) photos(a.p);
      y += 1.5; ensure(2); dc(C.line); doc.setLineWidth(0.2); doc.line(M, y, W-M, y); y += 3;
    });
    const cn = S.chn[ch.id];
    if (cn && ((cn.c||"").trim() || cn.p.some(id => PH[id]))) {
      ensure(12); font("bold",10); tc(C.ink); doc.text(clean(tr("notes")), M, y+4); y += 6.5;
      if ((cn.c||"").trim()) para(cn.c.trim(), M, CW, 9.5, "normal", C.ink, 4.6);
      photos(cn.p);
    }
    y += 5;
  });

  // Conclusion
  if ((S.concl||"").trim()) { h2(tr("conclusion")); para(S.concl.trim(), M, CW, 10, "normal", C.ink, 5); }

  // Pied de page
  const n = doc.getNumberOfPages();
  for (let p = 1; p <= n; p++) {
    doc.setPage(p);
    dc(C.line); doc.setLineWidth(0.3); doc.line(M, H-12, W-M, H-12);
    font("normal",8); tc(C.mut);
    const left = clean(tr("report") + ((S.info.client||"").trim() ? " - " + S.info.client.trim() : ""));
    doc.text(doc.splitTextToSize(left, CW-30)[0], M, H-7.5);
    doc.text(clean(`${tr("page")} ${p}/${n}`), W-M, H-7.5, {align:"right"});
  }
  return doc;
}

/* ===================== Démarrage ===================== */
loadLogo();
if ("serviceWorker" in navigator && location.protocol === "https:") {
  try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {} // sans effet dans l’aperçu claude.ai
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
$("#bNew").onclick = openReset;
$("#bPdf").onclick = openPdfModal;
render();
(async () => {
  const all = await kvAll();
  let s = null;
  try { s = all.state ? JSON.parse(all.state) : null; } catch (e) {}
  if (s && s.v === SCHEMA) {
    S = Object.assign(defaultState(), s); if (!LANGS.includes(S.lang)) S.lang = guessLang();
    if (!Array.isArray(S.team) || !S.team.length) S.team = [{n:"", r:"tech"}];
    if (typeof S.info.team === "string") { // ancien champ texte unique
      if (S.info.team.trim()) S.team = [{n:S.info.team.trim(), r:"tech"}];
      delete S.info.team; save();
    }
    Object.keys(all).forEach(k => { if (k.startsWith("p:")) PH[k.slice(2)] = all[k]; });
  } else if (Object.keys(all).length) {
    await kvClear(); // brouillon d’une ancienne version du questionnaire
  }
  render();
  getDownloads();
})();
</script>
